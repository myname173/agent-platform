apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-sandbox-gateway
  labels:
    app.kubernetes.io/name: platform-sandbox-gateway
    app.kubernetes.io/part-of: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-sandbox-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-sandbox-gateway
        app.kubernetes.io/part-of: agent-platform
    spec:
      serviceAccountName: platform-sandbox-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: agent-platform/sandbox-gateway:0.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SANDBOX_IMAGE
              value: agent-platform/sandbox:3.14-k8s-pilot
            - name: SANDBOX_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-runtime-secrets
                  key: CHAT_API_KEY
            # Request-level admission (P1). Defaults match sandbox_admission.js;
            # state is in-memory and per replica. See README "Request admission".
            - name: SANDBOX_RATE_RPM
              value: "30"
            - name: SANDBOX_RATE_BURST
              value: "10"
            - name: SANDBOX_MAX_INFLIGHT
              value: "4"
            # Empty = accounting mode: every authenticated caller is admitted
            # and labelled. Set e.g. "chat-gateway,agent-eval" to enforce the
            # allowlist (403 for anyone else, including header-less callers).
            - name: SANDBOX_ALLOWED_CALLERS
              value: ""
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
