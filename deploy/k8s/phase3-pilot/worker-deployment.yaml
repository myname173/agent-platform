apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
  labels:
    app.kubernetes.io/name: platform-worker
    app.kubernetes.io/part-of: agent-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-worker
        app.kubernetes.io/part-of: agent-platform
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: agent-platform/platform-runtime:0.1
          imagePullPolicy: IfNotPresent
          command: ["node", "worker.js"]
          envFrom:
            - configMapRef:
                name: platform-worker-config
          env:
            - name: JOB_CONSUMER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CHAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-runtime-secrets
                  key: CHAT_API_KEY
            - name: PLATFORM_RUNTIME_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-runtime-secrets
                  key: PLATFORM_RUNTIME_KEY
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
