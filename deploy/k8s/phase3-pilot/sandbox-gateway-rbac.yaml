apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-sandbox-gateway
  labels:
    app.kubernetes.io/name: platform-sandbox-gateway
    app.kubernetes.io/part-of: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-sandbox-gateway
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-sandbox-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-sandbox-gateway
subjects:
  - kind: ServiceAccount
    name: platform-sandbox-gateway
