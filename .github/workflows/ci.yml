name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-typecheck:
    name: Kiranism typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontent
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontent/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  workflows-validate:
    name: n8n workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate workflow sources & compose env hygiene
        run: node n8n/scripts/validate-workflows.mjs

      # Integration smoke tests need a live n8n with owner-created API keys,
      # which cannot be bootstrapped headlessly. Run them post-deploy instead:
      #   N8N_URL=… CHAT_API_KEY=… node n8n/scripts/smoke-test.mjs
