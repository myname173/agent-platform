name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-typecheck:
    name: Kiranism typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          # Same version the Dockerfile installs; 1.4.4 was verified to accept
          # the committed bun.lock under --frozen-lockfile.
          bun-version: 1.4.4

      # Cache the downloaded packages, not node_modules: the install still runs
      # and still has to agree with bun.lock. Key follows the lockfile so a
      # dependency change misses the cache instead of silently reusing it.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontent/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  workflows-validate:
    name: n8n workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate workflow sources & compose env hygiene
        run: node n8n/scripts/validate-workflows.mjs

      # Integration smoke tests need a live n8n with owner-created API keys,
      # which cannot be bootstrapped headlessly. Run them post-deploy instead:
      #   N8N_URL=… CHAT_API_KEY=… node n8n/scripts/smoke-test.mjs

  consumer-contract-tests:
    name: Event consumer offline contracts (not live acceptance)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Test idempotent consumption, offset ordering and outbox metrics
        run: node --test test-event-consumer.mjs
      # The live closed-loop check needs Docker + Kafka and is operator-run:
      #   deploy/event-bus/consumer-pilot.ps1 -Action check
      # Offline green is not live acceptance.

  sandbox-admission-contract-tests:
    name: Sandbox gateway admission contracts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test admission, metrics, HTTP handler and deploy caller patch
        run: node --test n8n/sandbox-gateway.test.mjs
      # No dependencies: the gateway modules are dependency-free CommonJS and
      # the tests drive the real HTTP handler with a fake runJob. Live gateway
      # acceptance (pilot bridge at 127.0.0.1:18080) is operator-run; offline
      # green is not live acceptance.

  kind-overlay-contract-tests:
    name: Kind multi-node overlay contracts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test kind config, overlay patches and render checker
        run: node --test deploy/k8s/phase6-kind/kind-overlay.test.mjs
      # No dependencies and no cluster: file-level contracts plus unit tests
      # of the render checker. The kubectl render gate and the multi-node
      # drill are operator-run on the deployment machine:
      #   node deploy/k8s/phase6-kind/kind-pilot.mjs render
      #   node deploy/k8s/phase6-kind/kind-pilot.mjs all
      # Offline green is not live acceptance.

  eval-contract-tests:
    name: Eval offline contracts (not live acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check suites and plan without model calls
        run: |
          node n8n/scripts/eval-validate.mjs
          node n8n/scripts/eval-run.mjs --dry --runs 3
      - name: Test graders, replay, mining and retrieval with negative controls
        run: node --test n8n/scripts/eval-contract.test.mjs n8n/scripts/eval-mine.test.mjs n8n/scripts/eval-judge.test.mjs n8n/scripts/kb-eval.test.mjs
      # Real replay is a separate gate until a complete, manually scrubbed
      # fixture batch is available. Offline green is not shakedown acceptance.

  kb-hybrid-contract-tests:
    name: KB hybrid retrieval contracts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test RRF fusion, BM25 availability, degradation and embedded-helper drift
        run: node --test n8n/scripts/kb-hybrid.test.mjs
      # No dependencies and no database: pure-function unit tests with a mock pg
      # client, plus verbatim-embedding drift guards across the three Code nodes
      # and the guarded-schema contract. Live hybrid efficacy (hit@1/MRR
      # before/after) is operator-run on the deployment machine:
      #   node n8n/scripts/kb-eval.mjs --isolated-stack          # vector baseline
      #   node n8n/scripts/kb-eval.mjs --isolated-stack --hybrid  # BM25+vector RRF
      # Offline green is not retrieval acceptance.

  web-fetch-contract-tests:
    name: web_fetch follow-up layer contracts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test SSRF guard, heuristic extract, fail-open, opt-in registration and vendored drift
        run: node --test n8n/scripts/web-fetch.test.mjs
      # No dependencies and no network: pure-function unit tests with a mock
      # httpRequest, behavioral opt-in registration (16 off / 17 on) running the
      # real gateway Code node, a verbatim-embedding drift guard, and mutation
      # proofs. Live efficacy (does reading whole pages improve answers) and the
      # SSRF DNS-rebinding / redirect residuals are operator-run on the deployment
      # machine: WEB_FETCH_ENABLED=true on a DISPOSABLE isolated stack, then the
      # agent answer-eval (kb-eval cannot measure it — web_fetch is not a KB stage).
      # Offline green is not answer acceptance.
