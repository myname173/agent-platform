global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: platform-runtime
    metrics_path: /metrics
    static_configs:
      - targets: [platform-runtime:3220]

  - job_name: stream-bridge
    metrics_path: /metrics
    static_configs:
      - targets: [stream-bridge:3211]

  # Optional event-bus-outbox profile services. These targets report down
  # when the profile is not running; that is expected, not an incident.
  - job_name: platform-outbox-publisher
    metrics_path: /metrics
    static_configs:
      - targets: [platform-outbox-publisher:9101]

  - job_name: platform-event-consumer
    metrics_path: /metrics
    static_configs:
      - targets: [platform-event-consumer:9102]

