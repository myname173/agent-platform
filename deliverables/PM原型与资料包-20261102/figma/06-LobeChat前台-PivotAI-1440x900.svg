<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<g id="Frame/LobeChat 前台 PivotAI v2（玻璃拟态 · 绿系）" transform="translate(0,0)"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#030712" /><g id="Background/Aurora 三段" transform="translate(0,0)"><rect x="0" y="0" width="1440" height="900" rx="0" fill="rgba(52,211,153,.22)" /><ellipse cx="180" cy="180" rx="380" ry="300" fill="rgba(52,211,153,.22)"/><ellipse cx="1240" cy="760" rx="360" ry="280" fill="rgba(34,197,94,.24)"/><ellipse cx="720" cy="360" rx="420" ry="260" fill="rgba(16,185,129,.15)"/></g><g id="Sidebar/会话列表（玻璃）" transform="translate(0,0)"><rect x="0" y="0" width="272" height="900" rx="0" fill="rgba(10,16,31,.68)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><circle cx="34" cy="42" r="15" fill="#34D399"/><text x="34" y="47" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#052E16" text-anchor="middle">P</text><text x="58" y="40" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#F8FAFC" text-anchor="start">PivotAI</text><text x="58" y="54" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="400" fill="#94A3B8" text-anchor="start">从对话到执行 · Chat less. Ship more.</text><rect x="18" y="76" width="236" height="32" rx="10" fill="rgba(34,197,94,.12)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="136" y="96" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#DCFCE7" text-anchor="middle">＋ 新建对话</text><text x="20" y="134" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0.5">今天</text><rect x="14" y="142" width="244" height="30" rx="9" fill="rgba(15,23,42,.6)" /><rect x="14" y="142" width="3" height="30" rx="0" fill="#34D399" /><text x="28" y="161" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#F8FAFC" text-anchor="start">🗂 看板口径与埋点整理</text><text x="28" y="199" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#CBD5E1" text-anchor="start">📡 动态监控复核</text><text x="20" y="232" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0.5">更早</text><text x="28" y="254" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#CBD5E1" text-anchor="start">🧾 发票结构化试点</text><text x="28" y="282" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#CBD5E1" text-anchor="start">⏱ 提醒为什么没响</text><rect x="14" y="310" width="244" height="86" rx="9" fill="rgba(15,23,42,.4)" stroke="rgba(245,158,11,.35)" stroke-width="1" stroke-dasharray="4 3"/><text x="24" y="330" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#FCD34D" text-anchor="start">⚠ 已知现象</text><text x="24" y="345" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#FCD34D" text-anchor="start">切到服务端数据库模式后，v1 存在浏览器本地的</text><text x="24" y="348" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="start">服务端 ⇒ 列表初始为空，需导入或重发</text><line x1="0" y1="828" x2="272" y2="828" stroke="rgba(34,197,94,.22)" stroke-width="1"/><circle cx="34" cy="858" r="14" fill="#16A34A"/><text x="34" y="862" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#DCFCE7" text-anchor="middle">黄</text><text x="56" y="856" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#94A3B8" text-anchor="start">黄泽华 · 设置/外观</text></g><g id="Composer/输入区" transform="translate(0,0)"><rect x="300" y="738" width="1112" height="104" rx="16" fill="rgba(15,23,42,.62)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="326" y="776" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="start">问点什么，或说「跑一下 会议行动项，正文：…」</text><rect x="326" y="800" width="96" height="26" rx="8" fill="rgba(52,211,153,.16)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="374" y="817" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#DCFCE7" text-anchor="middle">🌊 流式</text><rect x="430" y="800" width="96" height="26" rx="8" fill="rgba(52,211,153,.16)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="478" y="817" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#DCFCE7" text-anchor="middle">🧠 深度思考</text><rect x="534" y="800" width="96" height="26" rx="8" fill="rgba(52,211,153,.16)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="582" y="817" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#DCFCE7" text-anchor="middle">📚 知识库</text><rect x="638" y="800" width="96" height="26" rx="8" fill="rgba(52,211,153,.16)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="686" y="817" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#DCFCE7" text-anchor="middle">🧷 记忆</text><rect x="742" y="800" width="150" height="26" rx="8" fill="none" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="817" y="817" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="middle">🎙 语音（来→回语音）</text><rect x="900" y="800" width="150" height="26" rx="8" fill="none" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="975" y="817" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="middle">🖼 图片（&gt;8MB 失败）</text><rect x="1350" y="796" width="34" height="34" rx="9" fill="#34D399" /><text x="1367" y="818" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="800" fill="#04231A" text-anchor="middle">↑</text></g><g id="Messages/对话流" transform="translate(0,0)"><g id="Msg/用户" transform="translate(0,0)"><rect x="1000" y="150" width="400" height="52" rx="14" fill="rgba(15,23,42,.72)" stroke="rgba(52,211,153,.16)" stroke-width="1"/><text x="1016" y="172" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#F8FAFC" text-anchor="start">帮我把「11 月看板口径」派给阿哲，周五到期；</text><text x="1016" y="190" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#F8FAFC" text-anchor="start">顺便把上周的对账笔记存进知识库。</text></g><g id="Msg/AI + 工具轨迹" transform="translate(0,0)"><rect x="300" y="220" width="760" height="150" rx="14" fill="rgba(15,23,42,.62)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><rect x="316" y="236" width="3" height="40" rx="0" fill="#34D399" /><text x="328" y="252" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#34D399" text-anchor="start">深度思考 · 实时流（2 轮工具循环）</text><text x="328" y="270" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#94A3B8" text-anchor="start">先落待办 → 校验负责人通道 → 再走 kb_save；两步都是副作用工具，需要幂等保护。</text><text x="316" y="300" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#F8FAFC" text-anchor="start">已建待办并派给阿哲（11-06 到期）。24h 未回执会催办，第 3 次升级给你。</text><text x="316" y="320" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#F8FAFC" text-anchor="start">对账笔记已存进知识库，切了 17 个分块。</text><rect x="316" y="334" width="712" height="26" rx="9" fill="rgba(34,197,94,.06)" stroke="rgba(52,211,153,.2)" stroke-width="1"/><text x="328" y="351" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#A7F3D0" text-anchor="start">✔ todo_add · 812 ms · idem=implicit_hit(session+tool+sha256(args))</text></g><g id="Msg/搜索后端故障护栏" transform="translate(0,0)"><rect x="300" y="390" width="760" height="96" rx="14" fill="rgba(15,23,42,.62)" stroke="rgba(245,158,11,.4)" stroke-width="1"/><rect x="316" y="406" width="712" height="26" rx="9" fill="rgba(245,158,11,.08)" stroke="rgba(245,158,11,.4)" stroke-width="1"/><text x="328" y="423" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#FCD34D" text-anchor="start">⚠ web_search empty:true · unresponsive_engines=[brave,duckduckgo,google cse,startpage]</text><text x="316" y="458" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#F8FAFC" text-anchor="start">这一步我没能拿到外部资料（SearXNG 引擎全部被封）—— 不代表查不到。</text></g><g id="Topbar/模型与状态" transform="translate(0,0)"><rect x="272" y="0" width="1168" height="56" rx="0" fill="rgba(10,16,31,.68)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="300" y="34" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC" text-anchor="start">看板口径与埋点整理</text><rect x="470" y="16" width="180" height="26" rx="8" fill="rgba(15,23,42,.6)" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="484" y="33" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#E2E8F0" text-anchor="start">deepseek-chat</text><rect x="664" y="16" width="120" height="26" rx="13" fill="none" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="724" y="33" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#34D399" text-anchor="middle">流式 · 首字 1–3s</text><rect x="796" y="16" width="168" height="26" rx="13" fill="none" stroke="rgba(34,197,94,.22)" stroke-width="1"/><text x="880" y="33" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#34D399" text-anchor="middle">服务端工具 16 + wf_* · ≤2 轮</text><text x="1180" y="33" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="start">左上 LobeHub / 右上 PivotAI：品牌不一致是已知缺口</text></g></g></g>
</svg>
