e" font-size="10" font-weight="400" fill="#737373" text-anchor="start">/api/v1/executions · stats</text><rect x="324" y="282" width="286" height="64" rx="8" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="336" y="304" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600" fill="#0A0A0A" text-anchor="start">平台 / Keys</text><text x="336" y="324" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">admin/keys/manage</text><rect x="324" y="356" width="286" height="64" rx="8" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="336" y="378" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600" fill="#0A0A0A" text-anchor="start">平台 / Alerts</text><text x="336" y="398" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">admin/alerts · alerts/test</text><rect x="624" y="60" width="286" height="64" rx="8" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="636" y="82" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600" fill="#0A0A0A" text-anchor="start">平台 / Models</text><text x="636" y="102" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">admin/models</text><rect x="624" y="134" width="286" height="64" rx="8" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="636" y="156" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600" fill="#0A0A0A" text-anchor="start">平台 / Settings</text><text x="636" y="176" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">admin/settings（只读）</text><rect x="624" y="208" width="286" height="64" rx="8" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="636" y="230" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600" fill="#0A0A0A" text-anchor="start">Account / Profile / Notifications</text><text x="636" y="250" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">Clerk / 模板 demo</text></g><g id="Journey/一次派发的跨端旅程" transform="translate(0,0)"><text x="24" y="470" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="650" fill="#0A0A0A" text-anchor="start">② 跨端用户旅程：一句话 → 落库 → 触达 → 回执 → 升级（这条链路是平台的骨架）</text><rect x="24" y="500" width="296" height="120" rx="10" fill="#F5F5F5" stroke="#E6E6E6" stroke-width="1"/><text x="40" y="528" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0A0A0A" text-anchor="start">1 · 用户在 LobeHub 说一句</text><text x="40" y="550" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">「把 11 月看板口径派给阿哲，周五到期」</text><text x="40" y="566" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">前端不互调：LobeHub → stream-bridge → n8n</text><rect x="368" y="500" width="296" height="120" rx="10" fill="#F5F5F5" stroke="#E6E6E6" stroke-width="1"/><text x="384" y="528" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0A0A0A" text-anchor="start">2 · 网关工具循环（≤2 轮）</text><text x="384" y="550" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">todo_add + 负责人通道校验</text><text x="384" y="566" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">幂等：session+工具+sha256(args)，300s 窗口</text><rect x="712" y="500" width="296" height="120" rx="10" fill="#F5F5F5" stroke="#E6E6E6" stroke-width="1"/><text x="728" y="528" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0A0A0A" text-anchor="start">3 · 落库 + 触达</text><text x="728" y="550" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">todos / chat_executions / admin_audit</text><text x="728" y="566" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">notify：有通道发本人，无通道回落机主 degraded</text><rect x="1056" y="500" width="264" height="120" rx="10" fill="#F5F5F5" stroke="#E6E6E6" stroke-width="1"/><text x="1072" y="528" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0A0A0A" text-anchor="start">4 · 回执与催办</text><text x="1072" y="550" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">ta 停催不关单 / td 收口 / ts 顺延</text><text x="1072" y="566" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">0→1 催本人，≥2 升级，&gt;2 静默</text><rect x="1368" y="500" width="208" height="120" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1"/><text x="1384" y="528" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#92400E" text-anchor="start">5 · 可见性</text><text x="1384" y="550" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">控制台「今日」段 + 派发表</text><text x="1384" y="566" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">周报段【待办】完成/开放/逾期</text><g id="FlowArrow"><path d="M336,560 L368,560" stroke="#737373" stroke-width="1.5"/><polygon points="368,560 362.5,562.3 362.5,557.7" fill="#737373"/></g><g id="FlowArrow"><path d="M680,560 L712,560" stroke="#737373" stroke-width="1.5"/><polygon points="712,560 706.5,562.3 706.5,557.7" fill="#737373"/></g><g id="FlowArrow"><path d="M1024,560 L1056,560" stroke="#737373" stroke-width="1.5"/><polygon points="1056,560 1050.5,562.3 1050.5,557.7" fill="#737373"/></g><g id="FlowArrow"><path d="M1336,560 L1368,560" stroke="#737373" stroke-width="1.5"/><polygon points="1368,560 1362.5,562.3 1362.5,557.7" fill="#737373"/></g><g id="FailurePaths/失败与降级路径" transform="translate(0,0)"><text x="24" y="676" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="650" fill="#0A0A0A" text-anchor="start">③ 失败与降级：原型必须画的三条，而不是只画 happy path</text><rect x="24" y="700" width="1552" height="32" rx="6" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="40" y="720" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">上游 401/403 → 502 + 「n8n 拒绝了控制台的请求」，不伪装成用户登录过期</text><text x="1500" y="720" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">R-EX-01</text><rect x="24" y="738" width="1552" height="32" rx="6" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="40" y="758" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">web_search 返回 200 + results:[] → empty:true 透传，模型说「后端故障，不代表查不到」</text><text x="1500" y="758" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">R-EX-02</text><rect x="24" y="776" width="1552" height="32" rx="6" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="40" y="796" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">凌晨定时任务在桌面机器上会漏跑 → 多时间点 + Already Ran Today 守卫（fail-open）</text><text x="1500" y="796" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">R-EX-03</text><rect x="24" y="814" width="1552" height="32" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/><text x="40" y="834" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#991B1B" text-anchor="start">提醒写成功但响应 500（n8n 2.37.7）→ 孤儿提醒：现网真实缺陷，验收要单独一条</text><text x="1500" y="834" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">R-EX-04</text><rect x="24" y="852" width="1552" height="32" rx="6" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1"/><text x="40" y="872" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">沙箱审批按 sha256(代码原文) 绑定、一次性；模型不能自行联网，人点火</text><text x="1500" y="872" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="400" fill="#737373" text-anchor="start">R-EX-05</text></g></g></g>
</svg>
