 font-size="13.5" font-weight="600" fill="#0A0A0A" text-anchor="start">触达渠道</text><text x="16" y="42" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">未配置时告警仍写库，只是投递不出去——要把「没渠道」说清楚，而不是静默 · R-AL-01</text></g><g id="Badge/Telegram · 机主" transform="translate(40,180)"><rect x="0" y="0" width="92.60000000000001" height="18" rx="9" fill="#10B981"  opacity="0.14"/><rect x="0" y="0" width="92.60000000000001" height="18" rx="9" fill="none" stroke="#10B981" stroke-width="0.8"/><text x="46.300000000000004" y="12.5" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">Telegram · 机主</text></g><g id="Badge/团队 Webhook 未配置" transform="translate(176,180)"><rect x="0" y="0" width="98.8" height="18" rx="9" fill="#F59E0B"  opacity="0.14"/><rect x="0" y="0" width="98.8" height="18" rx="9" fill="none" stroke="#F59E0B" stroke-width="0.8"/><text x="49.4" y="12.5" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="middle">团队 Webhook 未配置</text></g><g id="Button/发送测试通知" transform="translate(40,212)"><rect x="0" y="0" width="55.599999999999994" height="28" rx="6" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1"/><text x="27.799999999999997" y="18" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#0A0A0A" text-anchor="middle">发送测试通知</text></g><text x="40" y="262" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">silence 维护窗口只停止投递、仍然记录</text><g id="Card/规则与阈值" transform="translate(592,124)"><rect x="0" y="0" width="564" height="220" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1"/><text x="16" y="26" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#0A0A0A" text-anchor="start">规则与阈值</text><text x="16" y="42" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">去重口径是这页的产品核心 · R-AL-02</text></g><rect x="592" y="188" width="532" height="26" rx="4" fill="#F0F0F0" /><text x="602" y="204" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">规则</text><text x="698" y="204" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">触发条件</text><text x="866" y="204" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">升级</text><text x="956" y="204" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">去重口径</text><line x1="592" y1="240" x2="1124" y2="240" stroke="#E6E6E6" stroke-width="1"/><text x="602" y="230" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">error_rate</text><text x="698" y="230" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">窗口 60min · 样本≥5 · ≥50%</text><text x="866" y="230" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">≥80% critical</text><text x="956" y="230" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">冷却 60 分钟</text><line x1="592" y1="266" x2="1124" y2="266" stroke="#E6E6E6" stroke-width="1"/><text x="602" y="256" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">cost_budget</text><text x="698" y="256" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">24h 花费 ≥ $2</text><text x="866" y="256" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">≥ $5 critical</text><text x="956" y="256" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">24h 一次，升级不受限</text><line x1="592" y1="292" x2="1124" y2="292" stroke="#E6E6E6" stroke-width="1"/><text x="602" y="282" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">embedding_quota</text><text x="698" y="282" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">kb_usage ≥ 80%</text><text x="866" y="282" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">≥ 95% critical</text><text x="956" y="282" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">同类 24h 一次</text><g id="Card/告警历史" transform="translate(24,360)"><rect x="0" y="0" width="1132" height="300" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1"/><text x="16" y="26" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#0A0A0A" text-anchor="start">告警历史</text><text x="16" y="42" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">ops_alerts 表现有 4 条（实机行数）· R-AL-03</text></g><rect x="24" y="424" width="1100" height="26" rx="4" fill="#F0F0F0" /><text x="34" y="440" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">时间</text><text x="122" y="440" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">类型</text><text x="232" y="440" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">消息</text><text x="702" y="440" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">错误率</text><text x="782" y="440" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#737373" text-anchor="start">触达</text><line x1="24" y1="476" x2="1124" y2="476" stroke="#E6E6E6" stroke-width="1"/><text x="34" y="466" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">11-02 09:41</text><text x="122" y="466" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">error_rate</text><text x="232" y="466" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">错误率 60.0%（6/10，窗口 60 分钟）超过阈值 50%</text><text x="702" y="466" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">60.0%</text><g id="Badge/已触达" transform="translate(782,454)"><rect x="0" y="0" width="30.6" height="18" rx="9" fill="#10B981"  opacity="0.14"/><rect x="0" y="0" width="30.6" height="18" rx="9" fill="none" stroke="#10B981" stroke-width="0.8"/><text x="15.3" y="12.5" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">已触达</text></g><line x1="24" y1="502" x2="1124" y2="502" stroke="#E6E6E6" stroke-width="1"/><text x="34" y="492" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-