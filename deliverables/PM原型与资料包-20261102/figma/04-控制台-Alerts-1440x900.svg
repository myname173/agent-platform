ont-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="600" fill="#EF4444" text-anchor="middle">触达失败</text></g><line x1="24" y1="554" x2="1124" y2="554" stroke="#E6E6E6" stroke-width="1"/><text x="34" y="544" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">10-30 04:20</text><text x="122" y="544" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">selfcheck</text><text x="232" y="544" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start">备份心跳 41.2h 未更新，超过 40h 阈值</text><text x="702" y="544" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#0A0A0A" text-anchor="start"></text><g id="Badge/未配置渠道" transform="translate(782,532)"><rect x="0" y="0" width="43" height="18" rx="9" fill="#F59E0B"  opacity="0.14"/><rect x="0" y="0" width="43" height="18" rx="9" fill="none" stroke="#F59E0B" stroke-width="0.8"/><text x="21.5" y="12.5" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="middle">未配置渠道</text></g><text x="24" y="684" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">错误率口径陷阱：stats 的错误率只覆盖网关 chat_executions，admin webhook 侧的 500 不计入 ——</text><text x="24" y="700" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#737373" text-anchor="start">所以「2.1% 错误率」与「提醒创建全挂」可以同时为真。这条要写进验收标准，不能只写在脑子里。</text><g id="Empty/空态" transform="translate(0,0)"><rect x="24" y="740" width="1132" height="60" rx="8" fill="#F0F0F0" stroke="#E6E6E6" stroke-width="1" stroke-dasharray="5 4"/><text x="590" y="776" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#737373" text-anchor="middle">暂无告警记录——平台安静运行中。</text></g></g></g>
