<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<g id="Frame/Telegram 通道 · 推送形态与派发状态机" transform="translate(0,0)"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0E1621" /><g id="Phone/推送流" transform="translate(0,0)"><rect x="0" y="0" width="400" height="880" rx="26" fill="#0E1621" stroke="#1F2B3A" stroke-width="1"/><rect x="0" y="0" width="400" height="60" rx="26" fill="#17212B" /><line x1="0" y1="60" x2="400" y2="60" stroke="#0D151D" stroke-width="1"/><circle cx="30" cy="30" r="17" fill="#34D399"/><text x="30" y="35" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#04231A" text-anchor="middle">P</text><text x="56" y="26" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#E9EDF2" text-anchor="start">PivotAI</text><text x="56" y="42" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#7D8AA0" text-anchor="start">bot · 推送与提醒</text><g id="Msg/晨报" transform="translate(0,0)"><rect x="16" y="84" width="368" height="300" rx="13" fill="#17212B" /><text x="30" y="106" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#8BE3AD" text-anchor="start">📰 晨报 · 2026-11-02</text><text x="30" y="128" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#E9EDF2" text-anchor="start">AI 大模型 最新进展</text><text x="30" y="145" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#E9EDF2" text-anchor="start">• 工具调用轮次压到 2 轮以内 —— 标题</text><text x="30" y="162" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#E9EDF2" text-anchor="start">工作流自动化与 Agent 平台</text><text x="30" y="179" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#E9EDF2" text-anchor="start">• n8n 2.37.7 数据表响应体变更 —— 标题</text><text x="30" y="196" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#E9EDF2" text-anchor="start">科技互联网要闻</text><text x="30" y="213" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#E9EDF2" text-anchor="start">• … —— 标题</text><text x="30" y="240" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#A7F3D0" text-anchor="start">平台状态</text><text x="30" y="258" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#E9EDF2" text-anchor="start">昨日 84 轮对话 · 错误率 2.1% · 自检 48 项全绿</text><text x="30" y="282" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="600" fill="#A7F3D0" text-anchor="start">## 待办速览</text><text x="30" y="300" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">• 逾期 1 条：周五交房租（10-31）</text><text x="30" y="315" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">• 今日到期 2 条：整理季度 OKR、约阿哲对账</text><text x="30" y="330" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">• 其他未完成 2 条</text><text x="30" y="362" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#7D8AA0" text-anchor="start">（完成任意一条：直接说「XXX 办完了」）</text></g><g id="Msg/告警" transform="translate(0,0)"><rect x="16" y="400" width="368" height="64" rx="13" fill="#17212B" /><text x="30" y="424" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#FCA5A5" text-anchor="start">[PivotAI 告警] error_rate</text><text x="30" y="444" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" font-weight="400" fill="#E9EDF2" text-anchor="start">错误率 60.0%（6/10，窗口 60 分钟）超过阈值 50%</text></g><g id="Msg/动态监控" transform="translate(0,0)"><rect x="16" y="480" width="368" height="110" rx="13" fill="#17212B" /><text x="30" y="502" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#8BE3AD" text-anchor="start">📡 动态监控 · 新发现 2 条</text><text x="30" y="524" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">▸ n8n 自托管 更新</text><text x="30" y="540" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">  • 2.37.7 改了 rows 响应体解析 —— https://…</text><text x="30" y="556" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">▸ AI Agent 编排框架</text><text x="30" y="572" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">  • 长上下文检索新基线 —— https://…</text><text x="30" y="578" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#7D8AA0" text-anchor="start">每关键词 1–3 条 · ≤60 字 · time_range=day · 同夜 seen 去重</text></g><g id="Msg/语音降级规则" transform="translate(0,0)"><rect x="16" y="606" width="368" height="110" rx="13" fill="#17212B" /><text x="30" y="628" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#E9EDF2" text-anchor="start">🎙 双向语音 · 镜像模式</text><text x="30" y="650" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#7D8AA0" text-anchor="start">来语音 → 回语音（qwen-tts · 音色 Cherry）</text><text x="30" y="666" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#7D8AA0" text-anchor="start">回复 ≤900 字才合成；&gt;900 字自动降级文字</text><text x="30" y="682" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#7D8AA0" text-anchor="start">识别失败：「这条语音我没听清…」</text></g><rect x="16" y="740" width="368" height="40" rx="20" fill="#242F3D" /><text x="40" y="765" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#7D8AA0" text-anchor="start">Message</text><circle cx="356" cy="760" r="17" fill="#2B5278"/><text x="356" y="765" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#CFE6FF" text-anchor="middle">🎙</text></g><g id="Phone/派发与催办（可点按钮）" transform="translate(0,0)"><rect x="420" y="0" width="400" height="880" rx="26" fill="#0E1621" stroke="#1F2B3A" stroke-width="1"/><rect x="420" y="0" width="400" height="60" rx="26" fill="#17212B" /><circle cx="450" cy="30" r="17" fill="#16A34A"/><text x="450" y="35" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#DCFCE7" text-anchor="middle">哲</text><text x="476" y="26" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#E9EDF2" text-anchor="start">阿哲</text><text x="476" y="42" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#7D8AA0" text-anchor="start">执行者 · Telegram 已绑定</text><g id="Card/新任务" transform="translate(0,0)"><rect x="436" y="84" width="368" height="132" rx="13" fill="#17212B" /><text x="450" y="106" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#8BE3AD" text-anchor="start">📌 新任务 · 11 月看板口径对齐</text><text x="450" y="124" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="400" fill="#7D8AA0" text-anchor="start">到期 11-06</text><text x="450" y="144" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">出看板初稿：自然周口径 + 埋点字段清单</text><text x="450" y="160" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">来自机主，已写入 todos</text><rect x="436" y="190" width="368" height="26" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="620" y="207" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#6FC4FF" text-anchor="middle">我收到了</text><rect x="436" y="216" width="368" height="26" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="620" y="233" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#8BE3AD" text-anchor="middle">已完成</text></g><g id="Card/催办 第 1 次" transform="translate(0,0)"><rect x="436" y="256" width="368" height="86" rx="13" fill="#17212B" /><text x="450" y="278" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#8BE3AD" text-anchor="start">⏰ 待办催办 · 已逾期 1 天</text><text x="450" y="296" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="9.5" font-weight="400" fill="#7D8AA0" text-anchor="start">remind_count 0→1 · 24h 冷却</text><rect x="436" y="320" width="184" height="24" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="528" y="336" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#6FC4FF" text-anchor="middle">我收到了</text><rect x="620" y="320" width="184" height="24" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="712" y="336" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8BE3AD" text-anchor="middle">已完成</text></g><g id="Card/逾期升级（发机主）" transform="translate(0,0)"><rect x="436" y="372" width="368" height="96" rx="13" fill="#2B5278" /><text x="450" y="394" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="start">🚨 逾期升级 · 来自 阿哲</text><text x="450" y="414" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#CFE6FF" text-anchor="start">11 月看板口径对齐 · 逾期 3 天、催办 2 次无回执</text><text x="450" y="429" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#CFE6FF" text-anchor="start">escalated=1，之后不再动（&gt;2）</text><rect x="436" y="444" width="184" height="24" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="528" y="460" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#8BE3AD" text-anchor="middle">已完成</text><rect x="620" y="444" width="184" height="24" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="712" y="460" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#6FC4FF" text-anchor="middle">推迟 1 天</text></g><g id="Card/无通道回落" transform="translate(0,0)"><rect x="436" y="500" width="368" height="92" rx="13" fill="#2B5278" /><text x="450" y="522" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="start">📌 新任务（回落机主）</text><text x="450" y="542" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#CFE6FF" text-anchor="start">审阅财务模板</text><text x="450" y="557" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#CFE6FF" text-anchor="start">（注：老周 没有可用通道，已改投机主）· status degraded</text><rect x="436" y="568" width="368" height="24" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="620" y="584" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#6FC4FF" text-anchor="middle">已完成 · 推迟 1 天</text></g><g id="Card/提醒（知道了 / 稍后）" transform="translate(0,0)"><rect x="436" y="624" width="368" height="92" rx="13" fill="#17212B" /><text x="450" y="646" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#8BE3AD" text-anchor="start">⏰ 提醒 · 15:00 提醒对账</text><text x="450" y="666" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#E9EDF2" text-anchor="start">与财务对一遍 10 月成交口径</text><rect x="436" y="682" width="368" height="24" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="620" y="698" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#6FC4FF" text-anchor="middle">知道了</text><rect x="436" y="708" width="368" height="22" rx="5" fill="#17212B" stroke="#0D151D" stroke-width="1"/><text x="620" y="723" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#6FC4FF" text-anchor="middle">1 小时后再提醒</text></g><rect x="436" y="740" width="368" height="40" rx="20" fill="#242F3D" /><text x="460" y="765" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#7D8AA0" text-anchor="start">Message</text></g><g id="状态机侧栏/写回口径" transform="translate(0,0)"><rect x="840" y="20" width="740" height="840" rx="16" fill="#141D26" stroke="#1F2B3A" stroke-width="1"/><text x="868" y="56" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#E9EDF2" text-anchor="start">派发状态机：每个按钮对应一次真实写库</text><text x="868" y="76" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">点完会清空按钮（editMessageReplyMarkup）防止重复点击；非机主只能对派给自己的 todo 做 ta / td</text><rect x="868" y="120" width="6" height="60" rx="0" fill="#8BE3AD" /><text x="888" y="138" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#E9EDF2" text-anchor="start">我收到了（ta）</text><text x="888" y="158" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">写 todos.ack_at → 停催但不关单（确认收到 ≠ 完成，这条最容易做错）</text><rect x="868" y="208" width="6" height="60" rx="0" fill="#8BE3AD" /><text x="888" y="226" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#E9EDF2" text-anchor="start">已完成（td）</text><text x="888" y="246" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">POST /webhook/admin/todos/complete → status=done，催办链当场停止</text><rect x="868" y="296" width="6" height="60" rx="0" fill="#8BE3AD" /><text x="888" y="314" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#E9EDF2" text-anchor="start">推迟 1 天（ts:24）</text><text x="888" y="334" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">写 todos.due_date += 24h，remind_count 保留</text><rect x="868" y="384" width="6" height="60" rx="0" fill="#8BE3AD" /><text x="888" y="402" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#E9EDF2" text-anchor="start">知道了（ap:rd:&lt;id&gt;）</text><text x="888" y="422" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">/admin/reminders/cancel → status=canceled</text><text x="888" y="437" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">⚠ 现网 n8n 2.37.7 写成功却回 500，留下孤儿提醒</text><rect x="868" y="472" width="6" height="60" rx="0" fill="#8BE3AD" /><text x="888" y="490" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#E9EDF2" text-anchor="start">1 小时后再提醒（ap:rs）</text><text x="888" y="510" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">写 reminders.due_at + status=pending</text><rect x="868" y="560" width="6" height="60" rx="0" fill="#8BE3AD" /><text x="888" y="578" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#E9EDF2" text-anchor="start">阶梯与冷却</text><text x="888" y="598" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">只催「已指派 + open + 逾期 + 未 ack」</text><text x="888" y="613" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">0/1 催本人，≥2 升级机主并 escalated=1，&gt;2 不再动</text><rect x="868" y="648" width="6" height="60" rx="0" fill="#8BE3AD" /><text x="888" y="666" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#E9EDF2" text-anchor="start">投递失败</text><text x="888" y="686" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">attempts ≥2 → reminders.status=failed，否则 pending 等下一轮</text><rect x="868" y="736" width="6" height="60" rx="0" fill="#8BE3AD" /><text x="888" y="754" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#E9EDF2" text-anchor="start">提醒投递失败 vs 待办催办</text><text x="888" y="774" font-family="Geist, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="400" fill="#7D8AA0" text-anchor="start">两个 kind 不同：待办催办 / 逾期升级 / 提醒，混用会让用户收到他没要求过的推送</text></g></g>
</svg>
