# ============================================================================
# Agent Platform - Unified Services Orchestration
# ============================================================================
# Manages: n8n (workflow engine), SearXNG (search), LobeChat (chat frontend)
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f n8n    # Follow n8n logs
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # n8n - Core Workflow & Agent Runtime
  # --------------------------------------------------------------------------
  n8n:
    # Version pinned via .env (N8N_VERSION); secrets come from .env too
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RELEASE_TYPE=stable
      # Encryption key pinned in .env so credentials survive rebuilds
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Chat Gateway reads the shared API key at runtime ($env.CHAT_API_KEY).
      # Must match lobechat's OPENAI_API_KEY below; rotate both together.
      - CHAT_API_KEY=${CHAT_API_KEY}
      # Public API key used by the retention workflow (self API calls)
      - N8N_API_KEY=${N8N_API_KEY}
      # Data table retention (days), consumed by Chat Retention workflow
      - RETENTION_DAYS_MESSAGES=${RETENTION_DAYS_MESSAGES}
      - RETENTION_DAYS_EXECUTIONS=${RETENTION_DAYS_EXECUTIONS}
      # Workflows read env vars via $env — explicitly allow env access
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Code nodes use node:crypto for managed API key hashing (gateway auth)
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Postgres is the primary datastore (migrated from SQLite 2026-09-14)
      - DB_TYPE=postgresdb
      # Knowledge base: pg module for SQL in Code nodes + DashScope embeddings
      - NODE_FUNCTION_ALLOW_EXTERNAL=pg
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - EMBEDDING_PROVIDER=dashscope/qwen3.7-text-embedding
      - EMBEDDING_DIM=1024      # Error-rate alerting (Chat Alerts workflow)
      - ALERT_WINDOW_MIN=${ALERT_WINDOW_MIN}
      - ALERT_RATE_THRESHOLD=${ALERT_RATE_THRESHOLD}
      - ALERT_MIN_TOTAL=${ALERT_MIN_TOTAL}
      - ALERT_COOLDOWN_MIN=${ALERT_COOLDOWN_MIN}
      # Alert delivery webhook (optional; empty = delivery skipped)
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ALERT_WEBHOOK_FORMAT=${ALERT_WEBHOOK_FORMAT:-generic}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # Console - Kiranism operations dashboard (Next.js standalone, Phase 1)
  # --------------------------------------------------------------------------
  console:
    build:
      context: ./frontent
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CONSOLE_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /auth/sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /auth/sign-up
        NEXT_PUBLIC_SENTRY_DISABLED: "true"
    container_name: platform-console
    restart: unless-stopped
    env_file:
      - ./frontent/.env.local
    environment:
      - N8N_URL=http://n8n:5678
    ports:
      - "3000:3000"
    depends_on:
      - n8n
    networks:
      - n8n-net

  # Postgres - n8n primary datastore (production-grade, replaced SQLite)
  # --------------------------------------------------------------------------
  postgres:
    # ParadeDB PG17: postgres + pgvector (kb) + pg_search (LobeHub 2.x full-text)
    image: paradedb/paradedb:latest-pg17
    container_name: postgres
    command: postgres -c shared_preload_libraries=pg_search
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # SearXNG - Privacy-respecting search engine (used by n8n tools)
  # --------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Config extracted from the previous manual container; JSON format
      # enabled so n8n search tools can call it as an API
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # n8n Code Sandbox - Isolated Python execution environment
  # --------------------------------------------------------------------------
  n8n-sandbox:
    image: python:3-alpine
    container_name: n8n-sandbox
    restart: unless-stopped
    command: ["python", "/mock.py"]
    volumes:
      - ./n8n/mock.py:/mock.py:ro
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # LobeChat - AI Conversation Frontend (User-facing)
  # --------------------------------------------------------------------------
  lobechat:
    # LobeHub 2.x — server-DB only (Better Auth, email/password built-in)
    image: lobehub/lobehub:latest
    container_name: lobechat
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      # Custom model provider pointing to n8n's OpenAI-compatible webhook
      - CUSTOM_MODELS=deepseek-agent,deepseek-chat,deepseek-reasoner,deepseek-v4-flash
      - OPENAI_PROXY_URL=http://n8n:5678/webhook/v1
      # Same key as n8n's CHAT_API_KEY — gateway auth depends on the match
      - OPENAI_API_KEY=${LOBECHAT_OPENAI_API_KEY}
      - OPENAI_MODEL_LIST=deepseek-agent,deepseek-chat,deepseek-reasoner,deepseek-v4-flash=DeepSeek V4 Flash（网关）<1048576:vision>
      # Server database (drizzle auto-migrates on start)
      - DATABASE_URL=${LOBECHAT_DATABASE_URL}
      # Better Auth (email/password built-in; SSO optional via AUTH_SSO_PROVIDERS)
      - AUTH_SECRET=${AUTH_SECRET}
      - KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}
      - JWKS_KEY=${JWKS_KEY}
      - APP_URL=http://${PLATFORM_LAN_IP:-192.168.1.114}:3210
      - INTERNAL_APP_URL=http://localhost:3210
      # LAN / phone access: extra trusted auth origins (comma-separated)
      - AUTH_ADDITIONAL_TRUSTED_ORIGINS=http://localhost:3210,http://127.0.0.1:3210
      # File storage: MinIO service below (Phase 4a). S3_ENDPOINT is the internal
      # container name; browsers resolve `minio` via the host hosts file (127.0.0.1).
      - S3_ENDPOINT=http://${PLATFORM_LAN_IP:-192.168.1.114}:9000 # LAN-reachable host so browser/phone presigned uploads work
      - S3_PUBLIC_DOMAIN=http://${PLATFORM_LAN_IP:-192.168.1.114}:9000
      - S3_ACCESS_KEY_ID=lobechat-files
      - S3_SECRET_ACCESS_KEY=lobechat-files-secret
      - S3_BUCKET=lobechat-files
      - S3_ENABLE_PATH_STYLE=1
      - S3_SET_ACL=0
    depends_on:
      n8n:
        condition: service_started
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # MinIO - S3-compatible object storage (LobeHub file/image uploads; Phase 4a)
  # --------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Root credentials aligned with lobechat S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
      - MINIO_ROOT_USER=lobechat-files
      - MINIO_ROOT_PASSWORD=lobechat-files-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - n8n-net

# ============================================================================
# Shared network & persistent volumes
# ============================================================================
networks:
  n8n-net:
    name: n8n-net
    external: true

volumes:
  n8n_data:
    name: n8n_data
    external: true
  postgres_data:
    # PG17 era volume; the old postgres_data volume is kept as rollback
    name: postgres_data_pg17
  minio_data:
    name: minio_data
