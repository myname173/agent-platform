# ============================================================================
# Agent Platform - Unified Services Orchestration
# ============================================================================
# Manages: n8n (workflow engine), SearXNG (search), LobeChat (chat frontend)
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f n8n    # Follow n8n logs
#
# Host ports
# ----------
# Every host-side port is overridable from .env (N8N_PORT, CONSOLE_PORT,
# LOBECHAT_PORT, SEARXNG_PORT, MINIO_API_PORT, MINIO_CONSOLE_PORT,
# STREAM_BRIDGE_PORT, CADDY_PORT_*). The container side never moves, so
# inter-service URLs keep working no matter what the host side becomes.
# restore.ps1 probes these on a new machine and rewrites .env when one is
# already taken, so a machine that owns 3000 can still run the stack.
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # n8n - Core Workflow & Agent Runtime
  # --------------------------------------------------------------------------
  n8n:
    # Version pinned via .env (N8N_VERSION); secrets come from .env too
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    restart: unless-stopped
    # Host side is overridable so a machine that already owns 5678 can still
    # run the stack (restore.ps1 rewrites these when it finds a conflict).
    # The container side stays 5678 — every internal URL below keeps working.
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RELEASE_TYPE=stable
      # Encryption key pinned in .env so credentials survive rebuilds
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Chat Gateway reads the shared API key at runtime ($env.CHAT_API_KEY).
      # Must match lobechat's OPENAI_API_KEY below; rotate both together.
      - CHAT_API_KEY=${CHAT_API_KEY}
      # Public API key used by the retention workflow (self API calls)
      - N8N_API_KEY=${N8N_API_KEY}
      # Platform Runtime v1: Redis-backed admission, locks and rate limits.
      - PLATFORM_RUNTIME_URL=http://platform-runtime:3220
      - PLATFORM_RUNTIME_KEY=${PLATFORM_RUNTIME_KEY:-}
      - PLATFORM_TOOL_IDEMPOTENCY_MODE=${PLATFORM_TOOL_IDEMPOTENCY_MODE:-fallback}
      - PLATFORM_KB_ASYNC_ENABLED=${PLATFORM_KB_ASYNC_ENABLED:-false}
      - SANDBOX_URL=${SANDBOX_URL:-http://n8n-sandbox:8000}
      - SANDBOX_APPROVED_URL=${SANDBOX_APPROVED_URL:-http://n8n-sandbox:8000}
      # Data table retention (days), consumed by Chat Retention workflow
      - RETENTION_DAYS_MESSAGES=${RETENTION_DAYS_MESSAGES}
      - RETENTION_DAYS_EXECUTIONS=${RETENTION_DAYS_EXECUTIONS}
      - RETENTION_DAYS_IDEMPOTENCY=${RETENTION_DAYS_IDEMPOTENCY:-7}
      # Seconds a side-effect tool execution stays replayable (0 disables dedupe)
      - IDEMPOTENCY_WINDOW_SEC=${IDEMPOTENCY_WINDOW_SEC:-300}
      # Max agent-loop tool rounds per request (raise to experiment, then read cap-rate.mjs)
      - MAX_TOOL_ROUNDS=${MAX_TOOL_ROUNDS:-2}
      # Workflows read env vars via $env — explicitly allow env access
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Code nodes use node:crypto for managed API key hashing (gateway auth)
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Postgres is the primary datastore (migrated from SQLite 2026-09-14)
      - DB_TYPE=postgresdb
      # Knowledge base: pg module for SQL in Code nodes + DashScope embeddings
      - NODE_FUNCTION_ALLOW_EXTERNAL=pg
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      # KB cross-encoder rerank (opt-in; default off = zero regression). The three
      # kb_search Code nodes read these via $env; blank model/url use canonical defaults.
      - KB_RERANK_ENABLED=${KB_RERANK_ENABLED:-false}
      - KB_RERANK_MODEL=${KB_RERANK_MODEL:-qwen3-rerank}
      - KB_RERANK_URL=${KB_RERANK_URL:-}
      - KB_RERANK_TOP_N=${KB_RERANK_TOP_N:-0}
      - KB_RERANK_INSTRUCT=${KB_RERANK_INSTRUCT:-}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
      - GENERIC_TIMEZONE=Asia/Shanghai
      - MCP_API_KEY=${MCP_API_KEY}
      - TZ=Asia/Shanghai
      # Console host port — the selfcheck reaches the console via
      # host.docker.internal:$CONSOLE_PORT (signed-doc link + "console up").
      # Must track the published port, so it cannot be hardcoded.
      - CONSOLE_PORT=${CONSOLE_PORT:-3000}
      # LobeHub host port — the selfcheck replays a browser CORS preflight
      # against the bucket with this origin. The bucket policy is written from
      # the same .env value (scripts/provision-bucket.sh), so a port change must
      # reach both or the check will report a false failure.
      - LOBECHAT_PORT=${LOBECHAT_PORT:-3210}
      - EMBEDDING_PROVIDER=dashscope/qwen3.7-text-embedding-flash
      - EMBEDDING_DIM=1024      # Error-rate alerting (Chat Alerts workflow)
      - ALERT_WINDOW_MIN=${ALERT_WINDOW_MIN}
      - ALERT_RATE_THRESHOLD=${ALERT_RATE_THRESHOLD}
      - ALERT_MIN_TOTAL=${ALERT_MIN_TOTAL}
      - ALERT_COOLDOWN_MIN=${ALERT_COOLDOWN_MIN}
      - ALERT_COST_24H_USD=${ALERT_COST_24H_USD:-2}
      - ALERT_COST_CRITICAL_USD=${ALERT_COST_CRITICAL_USD:-5}
      # Alert delivery webhook (optional; empty = delivery skipped)
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ALERT_WEBHOOK_FORMAT=${ALERT_WEBHOOK_FORMAT:-generic}
      # Console base URL used to build links pushed to phones (LAN-reachable).
      # Without it, workflow-generated links fall back to localhost and are dead on mobile.
      # Uses the HOST port, not the container port — this is the address a phone
      # dials, so it has to follow N8N/CONSOLE_PORT when that gets remapped.
      - CONSOLE_URL=http://${PLATFORM_LAN_IP:-127.0.0.1}:${CONSOLE_PORT:-3000}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # Tuning knobs the workflows read with sane in-code fallbacks; set them
      # here so a fresh deploy can be tuned from .env alone.
      - EMBED_QUOTA_TOKENS=${EMBED_QUOTA_TOKENS:-1000000}
      - ALERT_SEVERITY_CRITICAL=${ALERT_SEVERITY_CRITICAL:-0.8}
      # LobeHub owner account looked up by the memory mirror; change it if your
      # LobeHub was registered with a different address.
      - LOBEHUB_OWNER_EMAIL=${LOBEHUB_OWNER_EMAIL:-owner@agent-platform.local}
      # Fallback for link building when CONSOLE_URL is empty.
      - APP_URL=http://${PLATFORM_LAN_IP:-127.0.0.1}:${CONSOLE_PORT:-3000}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # Console - Kiranism operations dashboard (Next.js standalone, Phase 1)
  # --------------------------------------------------------------------------
  console:
    build:
      context: ./frontent
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CONSOLE_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /auth/sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /auth/sign-up
        NEXT_PUBLIC_SENTRY_DISABLED: "true"
    container_name: platform-console
    restart: unless-stopped
    env_file:
      # Gitignored (console secrets). A fresh clone has no such file — without
      # `required: false` compose refuses to load the whole stack.
      - path: ./frontent/.env.local
        required: false
    environment:
      - N8N_URL=http://n8n:5678
      - PLATFORM_RUNTIME_URL=http://platform-runtime:3220
      - PLATFORM_RUNTIME_KEY=${PLATFORM_RUNTIME_KEY:-}
      - CONSOLE_ADMIN_READ_CACHE_TTL_MS=${CONSOLE_ADMIN_READ_CACHE_TTL_MS:-3000}
    ports:
      - "${CONSOLE_PORT:-3000}:3000"
    depends_on:
      - n8n
    networks:
      - n8n-net

  # Postgres - n8n primary datastore (production-grade, replaced SQLite)
  # --------------------------------------------------------------------------
  postgres:
    # ParadeDB PG17: postgres + pgvector (kb) + pg_search (LobeHub 2.x full-text)
    image: paradedb/paradedb:latest-pg17
    container_name: postgres
    # pg_cron must be preloaded too: on a FRESH volume paradedb's
    # 10_bootstrap_paradedb.sh runs `CREATE EXTENSION IF NOT EXISTS pg_cron`
    # and aborts with "pg_cron can only be loaded via shared_preload_libraries",
    # taking the container down before the stack ever comes up. Existing volumes
    # never hit this (the bootstrap only runs once), which is why it took a
    # clean-machine dry run to surface.
    command: postgres -c shared_preload_libraries=pg_search,pg_cron
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # Redis - Platform Runtime coordination state
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # K8s pilot bridge: host loopback only; in-stack clients still use redis:6379.
    ports:
      - "127.0.0.1:${PLATFORM_REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - platform_redis_data:/data
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # SearXNG - Privacy-respecting search engine (used by n8n tools)
  # --------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      # Config extracted from the previous manual container; JSON format
      # enabled so n8n search tools can call it as an API
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # n8n Code Sandbox - Isolated Python execution environment
  # --------------------------------------------------------------------------
  n8n-sandbox:
    # Built locally instead of pulling bare python: the image carries numpy and
    # pandas (see n8n/sandbox.Dockerfile). First `up` on a fresh clone builds it
    # once (~1 min); afterwards it is cached.
    build:
      context: ./n8n
      dockerfile: sandbox.Dockerfile
    image: agent-platform/sandbox:3.14
    container_name: n8n-sandbox
    restart: unless-stopped
    # Real code-execution service (was `python /mock.py`, an unused stub).
    # NOT published to the host — only reachable from the docker network,
    # and every /run call needs the shared secret.
    command: ["python", "-u", "/sandbox.py"]
    volumes:
      - ./n8n/sandbox_server.py:/sandbox.py:ro
      - ./n8n/mock.py:/mock.py:ro
    expose:
      - "8000"
    environment:
      - SANDBOX_KEY=${CHAT_API_KEY}
      - SANDBOX_PORT=8000
      - SANDBOX_TIMEOUT=15
      # Address-space cap per run. 512 MB was too small to even import pandas.
      - SANDBOX_AS_MB=1536
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # LobeChat - AI Conversation Frontend (User-facing)
  # --------------------------------------------------------------------------
  lobechat:
    # LobeHub 2.x — server-DB only (Better Auth, email/password built-in)
    image: lobehub/lobehub:latest
    container_name: lobechat
    restart: unless-stopped
    ports:
      - "${LOBECHAT_PORT:-3210}:3210"
    environment:
      # Custom model provider pointing to n8n's OpenAI-compatible webhook
      - CUSTOM_MODELS=deepseek-agent,deepseek-chat,deepseek-reasoner,deepseek-v4-flash
      - OPENAI_PROXY_URL=http://stream-bridge:3211/v1
      # Same key as n8n's CHAT_API_KEY — gateway auth depends on the match
      - OPENAI_API_KEY=${LOBECHAT_OPENAI_API_KEY}
      - OPENAI_MODEL_LIST=deepseek-agent,deepseek-chat,deepseek-reasoner,deepseek-v4-flash=DeepSeek V4 Flash（网关）<1048576:vision>
      # Server database (drizzle auto-migrates on start)
      - DATABASE_URL=${LOBECHAT_DATABASE_URL}
      # Better Auth (email/password built-in; SSO optional via AUTH_SSO_PROVIDERS)
      - AUTH_SECRET=${AUTH_SECRET}
      - KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}
      - JWKS_KEY=${JWKS_KEY}
      # Host-facing: what a browser on the LAN actually dials.
      - APP_URL=http://${PLATFORM_LAN_IP:-127.0.0.1}:${LOBECHAT_PORT:-3210}
      # Server-side self reference — stays on the container port.
      - INTERNAL_APP_URL=http://localhost:3210
      # LAN / phone access: extra trusted auth origins (comma-separated).
      # Better Auth rejects a session whose Origin is not in this list, so these
      # have to track the HOST port too.
      - AUTH_ADDITIONAL_TRUSTED_ORIGINS=http://localhost:${LOBECHAT_PORT:-3210},http://127.0.0.1:${LOBECHAT_PORT:-3210}
      # File storage: RustFS service below (named `minio` for historical reasons).
      #
      # S3_ENDPOINT is what LobeHub builds its PRESIGN CLIENT from, so it is the
      # host the BROWSER will PUT to — it has to be an address the browser can
      # resolve, i.e. the LAN IP (or localhost for same-machine only). It is NOT
      # the internal service name: the host does not resolve `minio`, so pointing
      # S3_ENDPOINT at it would break the upload it is meant to fix.
      - S3_ENDPOINT=http://${PLATFORM_LAN_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}
      - S3_PUBLIC_DOMAIN=http://${PLATFORM_LAN_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}
      # Server-side S3 calls (the object stat taken before signing, delete,
      # multipart create) use this client instead. Keeping it on the stable
      # Docker service name is what stops a LAN IP change from breaking them —
      # leaving it unset is why a stale LAN IP surfaced as ECONNREFUSED on
      # upload.createS3PreSignedUrl (2026-10-08). Verified from the lobechat
      # container: http://minio:9000 answers 403, the old LAN IP does not answer.
      - S3_INTERNAL_ENDPOINT=${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=lobechat-files
      - S3_ENABLE_PATH_STYLE=1
      - S3_SET_ACL=0
    depends_on:
      n8n:
        condition: service_started
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # MinIO - S3-compatible object storage (LobeHub file/image uploads; Phase 4a)
  # --------------------------------------------------------------------------
  minio:
    # NOTE (2026-10): MinIO's community image is gone — deleted from Docker Hub
    # on 2026-09-11, gated behind auth on Quay on 2026-09-24. The drop-in
    # successor `quay.io/minio/aistor/minio` (free tier) was tried first but
    # refuses to serve: "No valid license found, running in offline mode. All S3
    # operations are denied." So the S3 backend is RustFS (Apache-2.0, S3-
    # compatible, MinIO-shaped: :9000 API, :9001 console, path-style + presigned
    # URLs). The service is still called `minio` and still uses the `minio_data`
    # volume so nothing else in the stack (or in lobechat's S3_* wiring) changes.
    image: rustfs/rustfs:latest
    container_name: minio
    restart: unless-stopped
    # RustFS ships a non-root default user, but a docker volume is created
    # root-owned — it then dies with "Io error: Permission denied (os error 13)"
    # while initialising /data. Running as root is the simplest correct fix here
    # (the previous MinIO image also ran as root, which is why it worked).
    user: "0:0"
    command: ["server", "--address", ":9000", "--console-enable", "--console-address", ":9001", "/data"]
    environment:
      # Same credentials the lobechat S3_* vars use — must stay in sync
      - RUSTFS_ACCESS_KEY=${MINIO_ROOT_USER}
      - RUSTFS_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RUSTFS_VOLUMES=/data
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - n8n-net

# ============================================================================
# Shared network & persistent volumes
# ============================================================================
  stream-bridge:
    image: n8nio/runners:latest
    container_name: stream-bridge
    entrypoint: ["node", "/app/server.js"]
    working_dir: /app
    volumes:
      - ./stream-bridge:/app:ro
    environment:
      - PORT=3211
      - GATEWAY_URL=http://n8n:5678/webhook/v1
      - UPSTREAM_BASE_URL=https://api.deepseek.com
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
      - CHAT_API_KEY=${CHAT_API_KEY}
      - LOG_URL=http://n8n:5678/webhook/internal/log-turn
      - PLATFORM_RUNTIME_URL=http://platform-runtime:3220
      - PLATFORM_RUNTIME_KEY=${PLATFORM_RUNTIME_KEY:-}
      - PLATFORM_RUNTIME_ENABLED=${PLATFORM_RUNTIME_ENABLED:-true}
      - PLATFORM_RATE_LIMIT_RPM=${PLATFORM_RATE_LIMIT_RPM:-60}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
    ports:
      - "127.0.0.1:${STREAM_BRIDGE_PORT:-3211}:3211"
    restart: unless-stopped
    networks:
      - n8n-net
    depends_on:
      n8n:
        condition: service_started
      platform-runtime:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Platform Runtime v1 - atomic coordination primitives
  # --------------------------------------------------------------------------
  platform-runtime:
    build:
      context: ./platform-runtime
    image: agent-platform/platform-runtime:0.1
    container_name: platform-runtime
    restart: unless-stopped
    environment:
      - PORT=3220
      - REDIS_URL=redis://redis:6379
      - PLATFORM_RUNTIME_KEY=${PLATFORM_RUNTIME_KEY:-}
      - CHAT_API_KEY=${CHAT_API_KEY}
      - IDEMPOTENCY_WINDOW_SEC=${IDEMPOTENCY_WINDOW_SEC:-300}
      - PLATFORM_RATE_LIMIT_RPM=${PLATFORM_RATE_LIMIT_RPM:-60}
      - PLATFORM_STATE_ENABLED=${PLATFORM_STATE_ENABLED:-true}
      - PLATFORM_DEPLOYMENT_MODE=${PLATFORM_DEPLOYMENT_MODE:-single-node-controlled}
      - PLATFORM_OUTBOX_WRITE_MODE=${PLATFORM_OUTBOX_WRITE_MODE:-off}
      - PLATFORM_OUTBOX_EVENT_KIND=${PLATFORM_OUTBOX_EVENT_KIND:-platform.state.transition}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    # K8s pilot bridge: host loopback only; in-stack clients still use
    # platform-runtime:3220.
    ports:
      - "127.0.0.1:${PLATFORM_RUNTIME_HOST_PORT:-13220}:3220"
    expose:
      - "3220"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3220/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - n8n-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Phase 2: optional Redis Streams worker for long-running kb_save jobs.
  # The entry path remains synchronous unless PLATFORM_KB_ASYNC_ENABLED=true.
  # --------------------------------------------------------------------------
  platform-worker:
    build:
      context: ./platform-runtime
    image: agent-platform/platform-runtime:0.1
    container_name: platform-worker
    profiles: ["phase2"]
    restart: unless-stopped
    command: ["node", "worker.js"]
    environment:
      - REDIS_URL=redis://redis:6379
      - JOB_STREAM=platform:jobs
      - JOB_GROUP=platform-kb-workers
      - JOB_CONSUMER=${PLATFORM_WORKER_CONSUMER:-worker-1}
      - JOB_MAX_ATTEMPTS=${PLATFORM_JOB_MAX_ATTEMPTS:-3}
      - JOB_CLAIM_IDLE_MS=${PLATFORM_JOB_CLAIM_IDLE_MS:-120000}
      - JOB_CLAIM_COUNT=${PLATFORM_JOB_CLAIM_COUNT:-10}
      - N8N_URL=http://n8n:5678
      - CHAT_API_KEY=${CHAT_API_KEY}
      - PLATFORM_RUNTIME_URL=http://platform-runtime:3220
      - PLATFORM_RUNTIME_KEY=${PLATFORM_RUNTIME_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      platform-runtime:
        condition: service_healthy
      n8n:
        condition: service_started
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # Phase 1.3 observability: internal runtime metrics + Prometheus.
  # Prometheus stays behind the optional profile; the core stack is unchanged.
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: platform-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      platform-runtime:
        condition: service_healthy
      stream-bridge:
        condition: service_started
    networks:
      - n8n-net

  # --------------------------------------------------------------------------
  # Phase 5.3: optional Kafka event-bus pilot. This is deliberately not the
  # kb_save execution queue; Redis Streams remains the current job path.
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.4.0
    container_name: platform-kafka
    hostname: kafka
    profiles: ["event-bus"]
    restart: unless-stopped
    # The official image runs as appuser; Docker named volumes start root-owned.
    # This single-node pilot uses root so the broker can initialize its data volume.
    user: "0:0"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-19092},PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - n8n-net

  # Phase 5.3: optional bridge from durable platform events to Kafka.
  # It is a side path for learning and event fan-out; Redis Streams remains
  # the asynchronous business execution queue.
  platform-event-publisher:
    build:
      context: ./platform-runtime
    image: agent-platform/platform-runtime:0.1
    container_name: platform-event-publisher
    profiles: ["event-bus"]
    restart: unless-stopped
    command: ["node", "event-publisher.js"]
    environment:
      - KAFKA_BROKERS=kafka:19092
      - KAFKA_TOPIC=${PLATFORM_KAFKA_TOPIC:-platform.events.v1}
      - PLATFORM_EVENT_START_ID=${PLATFORM_EVENT_START_ID:-latest}
      - PLATFORM_EVENT_POLL_MS=${PLATFORM_EVENT_POLL_MS:-500}
      - PLATFORM_EVENT_BATCH_SIZE=${PLATFORM_EVENT_BATCH_SIZE:-100}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

  # Phase 6.3: isolated Outbox Publisher v1 experiment. Runtime does not write
  # to platform.outbox yet; the pilot script seeds only kind=kafka-pilot rows.
  platform-outbox-publisher:
    build:
      context: ./platform-runtime
    image: agent-platform/outbox-publisher:0.1
    container_name: platform-outbox-publisher
    profiles: ["event-bus-outbox"]
    restart: unless-stopped
    command: ["node", "outbox-publisher.js"]
    environment:
      - KAFKA_BROKERS=kafka:19092
      - KAFKA_TOPIC=${PLATFORM_OUTBOX_KAFKA_TOPIC:-platform.events.outbox.v1}
      - OUTBOX_KIND=${PLATFORM_OUTBOX_KIND:-kafka-pilot}
      - OUTBOX_POLL_MS=${PLATFORM_OUTBOX_POLL_MS:-500}
      - OUTBOX_BATCH_SIZE=${PLATFORM_OUTBOX_BATCH_SIZE:-50}
      - OUTBOX_LEASE_SEC=${PLATFORM_OUTBOX_LEASE_SEC:-30}
      - OUTBOX_MAX_ATTEMPTS=${PLATFORM_OUTBOX_MAX_ATTEMPTS:-5}
      - OUTBOX_METRICS_PORT=9101
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

  # P0: idempotent consumer closing the outbox loop. Records each
  # (topic, dedupe_key) exactly once in platform.consumed_events; replay is a
  # counted no-op. Pilot scope: outbox topic only, no business side effects.
  platform-event-consumer:
    build:
      context: ./platform-runtime
    image: agent-platform/event-consumer:0.1
    container_name: platform-event-consumer
    profiles: ["event-bus-outbox"]
    restart: unless-stopped
    command: ["node", "event-consumer.js"]
    environment:
      - KAFKA_BROKERS=kafka:19092
      - KAFKA_TOPIC=${PLATFORM_OUTBOX_KAFKA_TOPIC:-platform.events.outbox.v1}
      - PLATFORM_CONSUMER_GROUP=${PLATFORM_CONSUMER_GROUP:-platform-event-consumer-v1}
      - PLATFORM_CONSUMER_FROM_BEGINNING=${PLATFORM_CONSUMER_FROM_BEGINNING:-true}
      - PLATFORM_CONSUMER_METRICS_PORT=9102
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

  # 备份（栈内）：刻意不依赖宿主机的计划任务。
  # 宿主机那个每日 03:30 的 Windows 任务改不动 —— schtasks.exe 被安全策略拦截，
  # PowerShell 的 Set-ScheduledTask 也返回"拒绝访问"，都要管理员。
  # 而它触发时 Docker 常常没开（09-22 / 09-23 连续两天失败，日志是
  # failed to connect to the docker API），StartWhenAvailable 补跑也一样失败。
  # 放进栈里之后：只要栈起来就一定会备份 —— 容器启动即跑一次，之后每 N 小时一轮。
  backup:
    build:
      context: ./backup
    container_name: platform-backup
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHAT_API_KEY=${CHAT_API_KEY}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-6}
      - BACKUP_MIN_AGE_HOURS=${BACKUP_MIN_AGE_HOURS:-20}
    volumes:
      - ./backups:/backups
      - n8n_data:/vol/n8n_data:ro
      - minio_data:/vol/minio_data:ro
      - ./docker-compose.yml:/cfg/docker-compose.yml:ro
      - ./.env:/cfg/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
    networks:
      - n8n-net

  # Caddy 反向代理：给局域网访问加一层 TLS，并为将来挂正式域名留好入口。
  # 现有端口一个都不动 —— 不想用就 docker compose stop caddy，原来的访问方式照旧。
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    # Four separate vars because compose cannot do arithmetic — a single base
    # port would need 8443+1, 8443+2 ... which there is no syntax for.
    ports:
      - "${CADDY_PORT_CONSOLE:-8443}:8443"
      - "${CADDY_PORT_LOBEHUB:-8444}:8444"
      - "${CADDY_PORT_N8N:-8445}:8445"
      - "${CADDY_PORT_MINIO:-8446}:8446"
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      # 证书的 SAN 里要写进局域网 IP，否则从手机访问时 SNI 对不上会握手失败。
      # 换网段后改 .env 里的 LAN_IP 并 restart caddy。
      - LAN_IP=${LAN_IP:-127.0.0.1}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - n8n-net
    depends_on:
      - console
      - lobechat
      - n8n
      - minio

networks:
  n8n-net:
    name: n8n-net
    external: true

volumes:
  n8n_data:
    name: n8n_data
    external: true
  postgres_data:
    # PG17 era volume; the old postgres_data volume is kept as rollback
    name: postgres_data_pg17
  minio_data:
    name: minio_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  platform_redis_data:
    name: platform_redis_data
  prometheus_data:
    name: prometheus_data
  kafka_data:
    name: kafka_data
